<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Daily Lingo</title>
<style>
:root{
  --paper:#f5f3ee; --card:#ffffff; --ink:#18202f; --muted:#5f6b80;
  --cobalt:#2547b8; --on-cobalt:#ffffff; --sky:#e1e8f6; --line:#d4dbe8;
  --seal:#b3261e; --ok:#1f7a4d; --amber:#e08a00; --amber-bg:#fff1d6;
  --shadow:0 1px 2px rgba(24,32,47,.06),0 6px 20px rgba(24,32,47,.06);
  --hanzi:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--paper:#0e1422;--card:#172036;--ink:#e9eef9;--muted:#9aa8c4;--cobalt:#7b95f2;--on-cobalt:#0b1226;--sky:#233155;--line:#2d3b5e;--seal:#ff6b5f;--ok:#4cc38a;--amber:#ffb84d;--amber-bg:#3a2d12;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25)}
 :root:not([data-theme="light"]) .opts button.right{background:#12382a}
 :root:not([data-theme="light"]) .opts button.wrong{background:#43201d}
}
:root[data-theme="dark"]{--paper:#0e1422;--card:#172036;--ink:#e9eef9;--muted:#9aa8c4;--cobalt:#7b95f2;--on-cobalt:#0b1226;--sky:#233155;--line:#2d3b5e;--seal:#ff6b5f;--ok:#4cc38a;--amber:#ffb84d;--amber-bg:#3a2d12;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25)}
:root[data-theme="dark"] .opts button.right{background:#12382a}
:root[data-theme="dark"] .opts button.wrong{background:#43201d}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.45;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding:12px 16px 110px}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.card:focus-visible,.sent:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;position:relative}
.brand{font-family:var(--hanzi);font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--amber);margin-inline-end:.35em;vertical-align:.05em}
.langbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.langbtn svg{width:14px;height:14px}
.langmenu{position:absolute;inset-inline-start:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:190px;z-index:40}
.langmenu button{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:start}
.langmenu button[aria-selected="true"]{background:var(--sky);color:var(--cobalt);font-weight:700}
.langmenu small{color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--cobalt);color:var(--on-cobalt);font-weight:700;font-size:1rem;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.avatar svg{width:20px;height:20px}
.tabbar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar-in{display:flex;max-width:560px;margin:0 auto;gap:2px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:600;padding:7px 2px;border-radius:12px;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--cobalt);background:var(--sky)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h2{font-size:1.05rem;margin:0 0 10px}
.note{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.row>*{min-width:0}
select,textarea,input[type=text],input[type=number]{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);width:100%}
textarea{min-height:100px;font-family:var(--hanzi)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--sky);color:var(--ink);width:100%}
.btn.primary{background:var(--cobalt);color:var(--on-cobalt)}
.btn.small{width:auto;padding:8px 14px;border-radius:10px}
.btn.danger{background:transparent;border:1px solid var(--seal);color:var(--seal)}
.actions{display:flex;gap:10px;margin-top:12px}
.actions .btn{flex:1}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.bar{height:6px;background:var(--sky);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--cobalt);width:0;transition:width .25s}
/* hero and home */
.hello{font-family:var(--hanzi);font-size:1.7rem;font-weight:700;margin:6px 0 12px;line-height:1.2}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.badge{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600}
.badge.fire{background:var(--amber-bg);border-color:transparent;color:var(--amber)}
.badge svg{width:16px;height:16px}
.goal{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--sky)}
.ring .fg{stroke:var(--cobalt);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}
.goal h2{margin:0 0 2px}
.wod .front{font-family:var(--hanzi);font-size:2.6rem;line-height:1.2;margin:4px 0}
.wod .front.en{font-family:var(--ui);font-weight:700;font-size:2.1rem}
.wod .py{color:var(--cobalt);font-weight:600;font-size:1.1rem}
.wod .mean{margin-top:2px}
.wod .top2{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;line-height:1;font-size:1rem}
/* learn card */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 20px;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;box-shadow:var(--shadow)}
.front{font-family:var(--hanzi);font-size:5rem;line-height:1.1;margin:0;word-break:keep-all}
.front.long{font-size:3.4rem}.front.xl{font-size:2.3rem}
.front.en{font-family:var(--ui);font-weight:700;font-size:2.8rem;word-break:break-word}
.front.en.long{font-size:2.2rem}
.pos{font-size:.8rem;color:var(--muted);margin-top:4px}
.reveal{margin-top:16px;min-height:80px;max-width:100%}
.pinyin{font-size:1.45rem;color:var(--cobalt);font-weight:600}
.meaning{font-size:1.2rem;margin-top:4px;unicode-bidi:plaintext}
.ex{margin-top:10px;font-size:.95rem;color:var(--muted);font-style:italic}
.hint{color:var(--muted);font-size:.9rem;margin-top:16px}
.speak{position:absolute;top:12px;inset-inline-end:12px}
.typebox{margin-top:12px}
.typebox .row{margin-bottom:8px}
.verdict{margin-top:10px;font-size:.9rem;font-weight:600}
.verdict.good{color:var(--ok)}.verdict.bad{color:var(--seal)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:2px 0 10px;cursor:pointer}
.toggle input{width:18px;height:18px}
.done{text-align:center;padding:36px 10px}
.done .front{font-size:3.6rem}
/* quiz */
.opts{display:grid;gap:8px;margin-top:14px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:1rem;text-align:start;cursor:pointer;color:var(--ink);unicode-bidi:plaintext}
.opts button.right{background:#e3f4ea;border-color:var(--ok)}
.opts button.wrong{background:#fbe6e4;border-color:var(--seal)}
.opts .hz{font-family:var(--hanzi);font-size:1.6rem}
.q{text-align:center;padding:10px 0}
.q .front{font-size:3.6rem}.q .front.en{font-size:2.2rem}
.q .ask{font-size:1.4rem;font-weight:600;unicode-bidi:plaintext}
.q .pinyin{font-size:1.5rem}
.bigplay{width:72px;height:72px;border-radius:50%;border:0;background:var(--cobalt);color:var(--on-cobalt);font-size:1.8rem;cursor:pointer;margin:6px auto}
/* stories */
.story-item{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.story-item .t{font-family:var(--hanzi);font-size:1.25rem;font-weight:700}
.story-item .te{color:var(--muted);font-size:.9rem}
.toggles{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0 12px;font-size:.9rem}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sent{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sent:last-child{border-bottom:0}
.sent .zh{font-family:var(--hanzi);font-size:1.4rem;line-height:1.6}
.sent .zh.en{font-family:var(--ui);font-size:1.2rem;line-height:1.5}
.sent .py{color:var(--cobalt);font-size:.95rem}
.sent .tr{color:var(--muted);font-size:.95rem;margin-top:2px;unicode-bidi:plaintext}
.back{border:0;background:transparent;color:var(--cobalt);font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.back svg{width:18px;height:18px}
:root[dir="rtl"] .flip{transform:scaleX(-1)}
/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.7rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.82rem}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.72rem;color:var(--muted)}
.chart i{display:block;width:100%;background:var(--cobalt);border-radius:8px 8px 3px 3px;min-height:3px;opacity:.9}
.chart i.today{background:var(--amber)}
.lvl{display:flex;justify-content:space-between;font-size:.9rem;margin-top:12px;gap:8px}
.lvl span:last-child{color:var(--muted);font-size:.82rem;text-align:end}
.lvlbar{height:8px;background:var(--sky);border-radius:99px;overflow:hidden;margin-top:4px;position:relative}
.lvlbar i{position:absolute;inset-block:0;inset-inline-start:0;display:block;background:var(--cobalt);opacity:.45}
.lvlbar b{position:absolute;inset-block:0;inset-inline-start:0;display:block;background:var(--cobalt)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:50}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(92vw,400px);background:var(--paper);z-index:60;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(0,0,0,.25);animation:slidein .22s ease-out}
:root[dir="rtl"] .drawer{box-shadow:8px 0 30px rgba(0,0,0,.25);animation-name:slideinrtl}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideinrtl{from{transform:translateX(-100%)}to{transform:none}}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dhead h2{margin:0;font-size:1.25rem}
.seg{display:flex;background:var(--sky);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--cobalt);box-shadow:0 1px 0 var(--line)}
.label{display:block;font-size:.85rem;font-weight:700;margin:14px 0 6px}
.err{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i,.ring .fg{transition:none}.drawer{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="langbtn" class="langbtn" aria-haspopup="listbox" aria-expanded="false"></button>
    <div id="langmenu" class="langmenu" role="listbox" hidden></div>
    <h1 class="brand"><i></i><span id="brandtxt">Daily Lingo</span></h1>
    <button id="profbtn" class="avatar"></button>
  </header>
  <div id="errbox"></div>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"><div class="tabbar-in" id="tabs"></div></nav>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden></aside>

<script src="data/ui.js"></script>
<script src="data/zh.js"></script>
<script src="data/en.js"></script>

<script>
(function(){
"use strict";
var LINGO = window.LINGO || {};
var UI = LINGO.ui || {en:{}};
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
var dayNum = function(){ return Math.floor((Date.now() - new Date().getTimezoneOffset()*60000)/864e5); };

/* ---------- state ---------- */
var KEY = "dailylingo.v2", OLDKEY = "dailyhanzi.v1";
function detectUi(){ var l=(navigator.language||"en").toLowerCase(); return l.indexOf("ar")===0?"ar":l.indexOf("zh")===0?"zh":"en"; }
function defaults(){ return {v:2,name:"",theme:"auto",ui:detectUi(),goal:20,lang:"zh",meaning:"zh",voice:"US",typeFirst:false,
  streak:{last:null,count:0},log:{},last:null,quiz:{zh:{r:0,t:0},en:{r:0,t:0}},
  langs:{zh:{progress:{},custom:[],level:"HSK 1"},en:{progress:{},custom:[],level:"A1"}}}; }
function assign(t,s){ for(var k in s){ if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k])) assign(t[k],s[k]); else t[k]=s[k]; } return t; }
function load(){
  var s=defaults();
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ assign(s,JSON.parse(raw)); }
    else{
      var old=localStorage.getItem(OLDKEY);
      if(old){ var o=JSON.parse(old); s.langs.zh.progress=o.progress||{}; s.langs.zh.custom=o.custom||[]; if(o.streak) s.streak=o.streak; }
    }
  }catch(e){}
  return s;
}
var S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- i18n ---------- */
function t(key,vars){
  var str=(UI[S.ui]&&UI[S.ui][key]) || (UI.en&&UI.en[key]) || key;
  if(vars) for(var k in vars) str=str.split("{"+k+"}").join(vars[k]);
  return str;
}
function applyUi(){
  var d=document.documentElement;
  d.setAttribute("lang",S.ui); d.setAttribute("dir",S.ui==="ar"?"rtl":"ltr");
  if(S.theme==="auto") d.removeAttribute("data-theme"); else d.setAttribute("data-theme",S.theme);
  document.title=t("app");
  $("brandtxt").textContent=t("app");
}

/* ---------- languages and cards ---------- */
var LANGS = {
  zh:{id:"zh",native:"中文",key:"lang_zh",levels:["HSK 1","HSK 2","HSK 3","HSK 4","HSK 5","HSK 6","HSK 7–9"],storyLevels:["HSK 1","HSK 2","HSK 3","HSK 4","HSK 5"],
      modes:[["h2m","q_h2m"],["m2h","q_m2h"],["p2h","q_p2h"],["listen","q_listen"]]},
  en:{id:"en",native:"English",key:"lang_en",levels:["A1","A2","B1"],storyLevels:["A1","A2","B1"],
      modes:[["w2m","q_w2m"],["m2w","q_m2w"],["listen","q_listen"],["spell","q_spell"]]}
};
var CARDS = {zh:null,en:null};
function buildZh(){
  var w=(LINGO.zh&&LINGO.zh.words)||[];
  return w.map(function(a){ return {id:a[0],f:a[0],r:a[1],m:{en:a[2]},mk:"en",ex:"",pos:"",lv:a[3]===7?"HSK 7–9":"HSK "+a[3],lang:"zh"}; });
}
function buildEn(){
  var w=(LINGO.en&&LINGO.en.words)||[];
  return w.map(function(a){ return {id:a[0]+"|"+a[1]+"|"+a[2],f:a[0],r:"",pos:a[1],lv:a[2],m:{zh:a[3],ar:a[4],en:a[5]},ex:a[6],alt:a[7]||[],lang:"en"}; });
}
function base(lang){ if(!CARDS[lang]) CARDS[lang]= lang==="zh"?buildZh():buildEn(); return CARDS[lang]; }
function customCards(lang){
  return S.langs[lang].custom.map(function(c){
    if(lang==="zh") return {id:c.h,f:c.h,r:c.p,mm:c.m,ex:"",pos:"",lv:"My words",lang:"zh",m:{}};
    return {id:"c|"+c.w,f:c.w,r:"",mm:c.m,ex:c.e||"",pos:"",lv:"My words",lang:"en",m:{},alt:[]};
  });
}
function meaningOf(c){ return c.mm || (c.m && c.m[c.mk||S.meaning]) || ""; }
function allCards(lang){ return base(lang).concat(customCards(lang)); }
function levelList(lang){ var l=LANGS[lang].levels.slice(); if(S.langs[lang].custom.length) l.push("My words"); return l; }
function levelLabel(l){ return l==="My words"?t("my_words"):l; }
function poolFor(lang,level){
  return allCards(lang).filter(function(c){ return (level==="All"||c.lv===level) && meaningOf(c); });
}
var curLang = function(){ return LANGS[S.lang]; };
var LS = function(){ return S.langs[S.lang]; };

/* ---------- progress ---------- */
var INTERVALS=[0,1,3,7,14];
function bump(field,n){ var d=dayNum(); var e=S.log[d]||(S.log[d]={c:0,q:0,qr:0}); e[field]=(e[field]||0)+(n||1); }
function touchStreak(){
  var d=dayNum(); if(S.streak.last===d) return;
  S.streak.count=(S.streak.last===d-1)?S.streak.count+1:1; S.streak.last=d;
}
function grade(card,ok){
  var P=LS().progress; var p=P[card.id]||{box:0,due:0};
  p.box=ok?Math.min(p.box+1,4):0; p.due=dayNum()+INTERVALS[p.box]; P[card.id]=p;
  bump("c"); touchStreak();
  for(var k in S.log){ if(+k<dayNum()-30) delete S.log[k]; }
  save();
}
function streakNow(){ var d=dayNum(); return (S.streak.last===d||S.streak.last===d-1)?S.streak.count:0; }
function dueCount(lang){
  var d=dayNum(),P=S.langs[lang].progress,n=0; for(var k in P) if(P[k].due<=d) n++; return n;
}

/* ---------- speech ---------- */
var voices=[];
function loadVoices(){ if("speechSynthesis" in window) voices=speechSynthesis.getVoices()||[]; }
if("speechSynthesis" in window){ loadVoices(); try{ speechSynthesis.onvoiceschanged=loadVoices; }catch(e){} }
var canSpeak = "speechSynthesis" in window;
function speakRaw(text,code,rate){
  if(!canSpeak||!text) return;
  var u=new SpeechSynthesisUtterance(text); u.lang=code; u.rate=rate||0.85;
  var v=null; for(var i=0;i<voices.length;i++){ if(voices[i].lang.replace("_","-").toLowerCase()===code.toLowerCase()){ v=voices[i]; break; } }
  if(!v) for(var j=0;j<voices.length;j++){ if(voices[j].lang.toLowerCase().indexOf(code.slice(0,2).toLowerCase())===0){ v=voices[j]; break; } }
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function codeFor(lang){ return lang==="zh"?"zh-CN":(S.voice==="UK"?"en-GB":"en-US"); }

/* ---------- Learn ---------- */
var queue=[], total=0, flipped=false, typed=null, typedOk=null;
function normText(s){ return String(s).toLowerCase().replace(/[\u064B-\u065F\u0670]/g,"").replace(/[\s.,;:!?'"()（）、，；：。！？·\-]+/g,""); }
function matchAnswer(input,meaning){
  var a=normText(input); if(!a) return false;
  var parts=String(meaning).replace(/\([^)]*\)|（[^）]*）/g,"").split(/[;；\/·,，、]+/).map(normText).filter(Boolean);
  var whole=normText(meaning);
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(p===a) return true;
    if(a.length>=3 && p.indexOf(a)>=0 && a.length>=Math.ceil(p.length*0.6)) return true;
    if(p.length>=3 && a.indexOf(p)>=0) return true;
  }
  return a.length>=3 && whole===a;
}
function buildQueue(){
  var d=dayNum(), P=LS().progress, pool=poolFor(S.lang,LS().level);
  var due=pool.filter(function(c){ return P[c.id]&&P[c.id].due<=d; }).sort(function(a,b){ return P[a.id].due-P[b.id].due; });
  var fresh=pool.filter(function(c){ return !P[c.id]; });
  queue=due.concat(fresh).slice(0,20); total=queue.length;
}
function startLearn(){ buildQueue(); flipped=false; typed=null; typedOk=null; renderLearn(); }
function levelChips(lang,cur,attr,withAll){

    return '<button data-l="'+esc(l)+'" aria-pressed="'+(l===cur)+'">'+esc(l==="All"?t("all"):levelLabel(l))+' · '+n.toLocaleString()+'</button>';
  }).join("")+'</div>';
}
function renderLearn(){

  } else if(!queue.length){
    body='<div class="panel done"><p class="front" style="font-size:3.4rem">✓</p><p><b>'+esc(total?t("session_done"):t("nothing_due"))+'</b></p><p class="note">'+esc(total?t("session_note"):t("pick_other"))+'</p><button class="btn primary" id="again-session" style="margin-top:14px">'+esc(t("new_session"))+'</button></div>';
  } else {

      '<div class="bar"><i style="width:'+(total?done/total*100:0)+'%"></i></div>'+
      '<div class="card" id="card" tabindex="0" role="button" aria-label="'+esc(t("show_answer"))+'">'+
        (canSpeak?'<button class="iconbtn speak" id="spk" aria-label="'+esc(t("tap_hear"))+'">'+SPK+'</button>':'')+
        frontHtml(c)+(c.pos&&c.lang==="en"?'<div class="pos">'+esc(c.pos)+'</div>':'')+
        '<div class="reveal">'+(flipped
          ? (c.r?'<div class="pinyin">'+esc(c.r)+'</div>':'')+'<div class="meaning" dir="auto">'+esc(meaningOf(c))+'</div>'+(c.ex?'<div class="ex" dir="ltr">'+esc(t("example"))+': '+esc(c.ex)+'</div>':'')+
            (typed!==null?'<div class="verdict '+(typedOk?"good":"bad")+'" dir="auto">'+esc(t("you_typed"))+': '+esc(typed||"—")+' · '+esc(typedOk?t("looks_right"):t("not_quite"))+'</div>':'')
          : (hasType?'':'<div class="hint">'+esc(t("tap_reveal"))+'</div>'))+'</div>'+
      '</div>'+
      (hasType?'<div class="typebox"><div class="row"><input type="text" id="tin" dir="auto" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(t("type_ph"))+'"></div><div class="actions"><button class="btn" id="tskip">'+esc(t("show_answer"))+'</button><button class="btn primary" id="tcheck">'+esc(t("check"))+'</button></div></div>':'')+
      '<div class="actions" '+(flipped?'':'hidden')+'><button class="btn" id="b-again">'+esc(t("again"))+' (1)</button><button class="btn primary" id="b-good">'+esc(t("got_it"))+' (2)</button></div>';

function answer(ok){

/* ---------- Quiz ---------- */
var qMode="h2m", qLevel=null, qList=[], qIdx=0, qScore=0, qLocked=false, qPool=[], qSpellDone=false;
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function startQuiz(){
  var modes=curLang().modes.map(function(m){return m[0];}); if(modes.indexOf(qMode)<0) qMode=modes[0];
  if(!qLevel) qLevel=LS().level;
  qPool=poolFor(S.lang,qLevel); if(qPool.length<4) qPool=poolFor(S.lang,"All");
  var src=qMode==="spell"?qPool.filter(function(x){return /^[A-Za-z][A-Za-z -]*$/.test(x.f);}):qPool;
  qList=shuffle(src).slice(0,10); qIdx=0; qScore=0; qLocked=false; qSpellDone=false; renderQuiz();

    '<select id="qmode" aria-label="'+esc(t("quiz_mode"))+'">'+curLang().modes.map(function(m){ return '<option value="'+m[0]+'" '+(m[0]===qMode?"selected":"")+'>'+esc(t(m[1]))+'</option>'; }).join("")+'</select></div>';
}
function qFinish(){

}
function renderQuiz(){
  var el=$("main");
  if(!qList.length){ el.innerHTML=quizControls()+'<div class="panel done"><p class="note">'+esc(t("pick_other"))+'</p></div>'; bindQuizControls(); return; }
  if(qIdx>=qList.length){ qFinish(); bindQuizControls(); return; }
  var c=qList[qIdx], isEn=c.lang==="en";
  var mode=qMode, prompt="", opts="", extra="";
  var head='<div class="meta"><span>'+esc(t("question_of",{n:qIdx+1,t:qList.length}))+'</span><span>'+esc(t("score_n",{n:qScore}))+'</span></div><div class="bar"><i style="width:'+(qIdx/qList.length*100)+'%"></i></div>';
  function frontOpts(){ var w=shuffle(qPool.filter(function(x){return x.id!==c.id&&x.f!==c.f;})).slice(0,3); return shuffle([c].concat(w)); }
  function meanOpts(){ var w=shuffle(qPool.filter(function(x){return x.id!==c.id&&meaningOf(x)!==meaningOf(c);})).slice(0,3); return shuffle([c].concat(w)); }
  if(mode==="h2m"||mode==="w2m"){
    prompt=frontHtml(c)+(c.pos&&isEn?'<div class="pos">'+esc(c.pos)+'</div>':'');

  } else if(mode==="m2h"||mode==="m2w"){
    prompt='<div class="ask" dir="auto">'+esc(meaningOf(c))+'</div>';
    opts=frontOpts().map(function(o){ return '<button class="'+(isEn?"":"hz")+'" data-id="'+esc(o.id)+'" dir="ltr">'+esc(o.f)+'</button>'; }).join("");
  } else if(mode==="p2h"){
    prompt='<div class="ask pinyin" dir="ltr">'+esc(c.r)+'</div>';
    opts=frontOpts().map(function(o){ return '<button class="hz" data-id="'+esc(o.id)+'" dir="ltr">'+esc(o.f)+'</button>'; }).join("");
  } else if(mode==="listen"){
    prompt='<div class="ask">'+esc(t("listen_choose"))+'</div><button class="bigplay" id="qplay" aria-label="'+esc(t("replay"))+'">'+SPK+'</button>';
    opts=frontOpts().map(function(o){ return '<button class="'+(isEn?"":"hz")+'" data-id="'+esc(o.id)+'" dir="ltr">'+esc(o.f)+'</button>'; }).join("");
  } else if(mode==="spell"){
    prompt='<div class="ask">'+esc(t("listen_type"))+'</div><button class="bigplay" id="qplay" aria-label="'+esc(t("replay"))+'">'+SPK+'</button>'+(c.pos?'<div class="pos">'+esc(c.pos)+' · '+esc(meaningOf(c))+'</div>':'');
    extra='<div class="typebox"><div class="row"><input type="text" id="sin" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(t("type_word"))+'"></div><div id="sres"></div><div class="actions"><button class="btn primary" id="scheck">'+esc(t("check"))+'</button></div></div>';
  }

  bindQuizControls();
  if($("qplay")){ $("qplay").onclick=function(){ speak(c.f,c.lang); }; setTimeout(function(){ speak(c.f,c.lang); },250); }

      if(qLocked) return;

      qLocked=true;
      var forms=[c.f].concat(c.alt||[]).map(function(x){return x.toLowerCase().replace(/[^a-z0-9]/g,"");});
      var ans=$("sin").value.toLowerCase().replace(/[^a-z0-9]/g,"");

    };

}
function bindQuizControls(){

function quizTally(ok){ var q=S.quiz[S.lang]||(S.quiz[S.lang]={r:0,t:0}); q.t++; if(ok) q.r++; bump("q"); if(ok) bump("qr"); save(); }
function pickOpt(btn,c){
  if(qLocked) return; qLocked=true;
  var ok=btn.getAttribute("data-id")===c.id;
  btn.classList.add(ok?"right":"wrong");
  if(!ok) Array.prototype.forEach.call(document.querySelectorAll(".opts button"),function(b){ if(b.getAttribute("data-id")===c.id) b.classList.add("right"); });
  if(ok) qScore++;
  grade(c,ok); quizTally(ok);
  if(qMode!=="listen") speak(c.f,c.lang);
  setTimeout(function(){ qIdx++; qLocked=false; renderQuiz(); },1100);
}

/* ---------- Stories ---------- */
function STORIES(lang){ return lang==="zh" ? (function(){ var s=(LINGO.zh&&LINGO.zh.stories)||{}, o={}; for(var k in s) o["HSK "+k]=s[k]; return o; })() : ((LINGO.en&&LINGO.en.stories)||{}); }
function trLang(){ return S.meaning==="ar"||S.meaning==="zh"?S.meaning:null; }
function storyTitle(lang,st){
  if(lang==="zh") return st.t;
  var tl=trLang(); return tl==="zh"?st.t[1]:tl==="ar"?st.t[2]:st.t[0];
}
var sLevel=null, sOpen=null, showPy=true, showTr=false, revealed={};
function renderStories(){
  var el=$("main"), lang=S.lang, SS=STORIES(lang), levels=curLang().storyLevels;
  if(!sLevel||levels.indexOf(sLevel)<0) sLevel=levels[0];
  var chips='<div class="chips">'+levels.map(function(l){ return '<button data-l="'+esc(l)+'" aria-pressed="'+(l===sLevel)+'">'+esc(l)+'</button>'; }).join("")+'</div>';
  var list=(SS[sLevel]||[]);
  if(sOpen===null||!list[sOpen]){
    sOpen=null;
    el.innerHTML=chips+list.map(function(st,i){
      var sub=lang==="zh"?st.te:st.t[0];
      return '<button class="story-item" data-i="'+i+'"><div class="t" dir="auto">'+esc(storyTitle(lang,st))+'</div><div class="te" dir="auto">'+esc(sub)+' · '+esc(t("sentences_n",{n:st.s.length}))+'</div></button>';
    }).join("")+'<p class="note">'+esc(t("stories_note"))+'</p>';
    Array.prototype.forEach.call(el.querySelectorAll(".story-item"),function(b){ b.onclick=function(){ sOpen=+b.getAttribute("data-i"); revealed={}; S.last={lang:lang,level:sLevel,idx:sOpen}; save(); renderStories(); window.scrollTo(0,0); }; });
  } else {
    var st=list[sOpen], tl=trLang();
    var isZh=lang==="zh";
    var canTr=isZh||!!tl;
    el.innerHTML='<button class="back" id="sback">'+IC.back+'<span>'+esc(t("back_to_stories",{lvl:sLevel}))+'</span></button>'+
      '<div class="panel"><h2 style="font-family:var(--hanzi);font-size:1.4rem" dir="auto">'+esc(storyTitle(lang,st))+'</h2>'+
      '<div class="toggles">'+(isZh?'<label><input type="checkbox" id="tpy" '+(showPy?"checked":"")+'> '+esc(t("show_reading"))+'</label>':'')+
      (canTr?'<label><input type="checkbox" id="ttr" '+(showTr?"checked":"")+'> '+esc(t("show_translation"))+'</label>':'')+
      (canSpeak?'<button class="btn small" id="playall">▶ '+esc(t("play_all"))+'</button>':'')+'</div>'+
      st.s.map(function(r,i){
        var py=isZh?r[1]:"", trn=isZh?r[2]:(tl==="zh"?r[1]:tl==="ar"?r[2]:"");
        return '<div class="sent" data-i="'+i+'" tabindex="0"><div class="zh '+(isZh?"":"en")+'" dir="ltr">'+esc(r[0])+'</div>'+
          (isZh?'<div class="py" dir="ltr" '+(showPy?"":"hidden")+'>'+esc(py)+'</div>':'')+
          (canTr?'<div class="tr" dir="auto" '+((showTr||revealed[i])?"":"hidden")+'>'+esc(trn)+'</div>':'')+'</div>';
      }).join("")+
      '<p class="note">'+esc(t("tap_sentence"))+(canSpeak?"":" "+esc(t("no_speech")))+'</p></div>';
    $("sback").onclick=function(){ sOpen=null; stopSpeech(); renderStories(); };
    if($("tpy")) $("tpy").onchange=function(e){ showPy=e.target.checked; renderStories(); };
    if($("ttr")) $("ttr").onchange=function(e){ showTr=e.target.checked; renderStories(); };
    if($("playall")) $("playall").onclick=function(){ stopSpeech(); st.s.forEach(function(r){ speakRaw(r[0],codeFor(lang),lang==="zh"?0.8:0.9); }); };
    Array.prototype.forEach.call(el.querySelectorAll(".sent"),function(d){
      var fn=function(){ var i=+d.getAttribute("data-i"); speak(st.s[i][0],lang); if(canTr&&!showTr){ revealed[i]=true; var x=d.querySelector(".tr"); if(x) x.hidden=false; } };
      d.onclick=fn; d.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fn(); } };
    });
  }
  Array.prototype.forEach.call(el.querySelectorAll(".chips button"),function(b){ b.onclick=function(){ sLevel=b.getAttribute("data-l"); sOpen=null; renderStories(); }; });
}

/* ---------- Stats ---------- */
function renderStats(){
  var lang=S.lang, P=S.langs[lang].progress, cards=allCards(lang);
  var started=0, known=0; for(var k in P){ started++; if(P[k].box>=3) known++; }
  var q=S.quiz[lang]||{r:0,t:0};
  var acc=q.t?Math.round(q.r/q.t*100)+"%":"—";
  var today=dayNum(), done=(S.log[today]||{}).c||0;
  var locale=S.ui==="ar"?"ar":S.ui==="zh"?"zh-CN":"en";
  var days=[],max=Math.max(1,S.goal|0||20);
  for(var i=6;i>=0;i--){ var d=today-i; var v=(S.log[d]||{}).c||0; max=Math.max(max,v); days.push({d:d,v:v}); }
  var bars=days.map(function(x){
    var lab=new Date(x.d*864e5+12*3600e3).toLocaleDateString(locale,{weekday:"short",timeZone:"UTC"});
    return '<div><span>'+x.v+'</span><i class="'+(x.d===today?"today":"")+'" style="height:'+Math.max(3,x.v/max*100)+'px"></i><span>'+esc(lab)+'</span></div>';
  }).join("");
  var counts={}; levelList(lang).forEach(function(l){ counts[l]={n:0,s:0,k:0}; });
  cards.forEach(function(c){ var e=counts[c.lv]; if(!e) return; e.n++; var p=P[c.id]; if(p){ e.s++; if(p.box>=3) e.k++; } });
  var lv=levelList(lang).map(function(l){ var e=counts[l]; if(!e.n) return "";
    return '<div class="lvl"><span>'+esc(levelLabel(l))+'</span><span>'+esc(t("started_known",{s:e.s,k:e.k}))+' / '+e.n.toLocaleString()+'</span></div><div class="lvlbar"><i style="width:'+(e.s/e.n*100)+'%"></i><b style="width:'+(e.k/e.n*100)+'%"></b></div>'; }).join("");
  $("main").innerHTML='<h2 style="margin:6px 0 12px;font-size:1.3rem">'+esc(t("stats"))+' · '+esc(curLang().native)+'</h2>'+
    '<div class="stat-grid"><div class="stat"><b>'+streakNow()+'</b><span>'+esc(t("streak"))+' ('+esc(t("days"))+')</span></div>'+
    '<div class="stat"><b>'+done+'</b><span>'+esc(t("cards_today"))+'</span></div>'+
    '<div class="stat"><b>'+dueCount(lang)+'</b><span>'+esc(t("due_today"))+'</span></div>'+
    '<div class="stat"><b>'+acc+'</b><span>'+esc(t("accuracy"))+(q.t?'':' · '+esc(t("no_quiz")))+'</span></div>'+
    '<div class="stat"><b>'+started+'</b><span>'+esc(t("started_words"))+'</span></div>'+
    '<div class="stat"><b>'+known+'</b><span>'+esc(t("known_words"))+'</span></div></div>'+
    '<div class="panel"><h2>'+esc(t("last7"))+'</h2><div class="chart">'+bars+'</div></div>'+
    '<div class="panel"><h2>'+esc(t("by_level"))+'</h2>'+lv+'</div>';
}

/* ---------- Profile drawer ---------- */
var drawerOpener=null;
function openDrawer(){
  drawerOpener=document.activeElement;
  renderDrawer(); $("scrim").hidden=false; $("drawer").hidden=false;
  var f=$("dclose"); if(f) f.focus();
}
function closeDrawer(){ $("scrim").hidden=true; $("drawer").hidden=true; if(drawerOpener&&drawerOpener.focus) drawerOpener.focus(); renderShell(); render(); }
$("profbtn").onclick=openDrawer; $("scrim").onclick=closeDrawer;
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(!$("drawer").hidden) closeDrawer(); else closeLangMenu(); } });
function segHtml(id,opts,cur){ return '<div class="seg" id="'+id+'">'+opts.map(function(o){ return '<button data-v="'+o[0]+'" aria-pressed="'+(o[0]===cur)+'">'+esc(o[1])+'</button>'; }).join("")+'</div>'; }
function bindSeg(id,fn){ Array.prototype.forEach.call($(id).querySelectorAll("button"),function(b){ b.onclick=function(){ fn(b.getAttribute("data-v")); }; }); }
function renderDrawer(){
  var d=$("drawer");
  d.setAttribute("aria-label",t("profile_title"));
  d.innerHTML=
  '<div class="dhead"><h2>'+esc(t("profile_title"))+'</h2><button class="iconbtn" id="dclose" aria-label="'+esc(t("close"))+'">✕</button></div>'+
  '<div class="panel"><label class="label" for="dname" style="margin-top:0">'+esc(t("display_name"))+'</label><input type="text" id="dname" maxlength="30" dir="auto" value="'+esc(S.name)+'" placeholder="'+esc(t("name_ph"))+'">'+
   '<span class="label">'+esc(t("theme"))+'</span>'+segHtml("sg-theme",[["auto",t("theme_auto")],["light",t("theme_light")],["dark",t("theme_dark")]],S.theme)+
   '<span class="label">'+esc(t("ui_lang"))+'</span>'+segHtml("sg-ui",[["en","English"],["ar","العربية"],["zh","中文"]],S.ui)+
   '<label class="label" for="dgoal">'+esc(t("daily_goal"))+'</label><input type="number" id="dgoal" min="5" max="500" step="5" value="'+(S.goal|0)+'"></div>'+
  '<div class="panel"><h2>'+esc(t("lang_en"))+'</h2>'+
   '<span class="label" style="margin-top:0">'+esc(t("meanings_lang"))+'</span>'+segHtml("sg-mean",[["zh",t("m_zh")],["ar",t("m_ar")],["en",t("m_en")]],S.meaning)+
   '<span class="label">'+esc(t("voice"))+'</span>'+segHtml("sg-voice",[["US",t("voice_us")],["UK",t("voice_uk")]],S.voice)+'</div>'+
  '<div class="panel"><h2>'+esc(t("backup"))+'</h2>'+
   '<div class="actions" style="margin-top:0"><button class="btn" id="bexp">'+esc(t("export_btn"))+'</button><button class="btn" id="bcopy">'+esc(t("copy_code"))+'</button></div>'+
   '<textarea id="bcode" dir="ltr" placeholder="'+esc(t("paste_code"))+'" style="margin-top:10px;font-family:monospace;font-size:.8rem"></textarea>'+
   '<div class="actions"><button class="btn" id="bimp">'+esc(t("import_btn"))+'</button><button class="btn" id="bfile">'+esc(t("import_file"))+'</button></div>'+
   '<input type="file" id="ffile" accept="application/json,.json" hidden><p class="note" id="bmsg"></p></div>'+
  '<div class="panel"><h2>'+esc(t("add_words"))+' · '+esc(curLang().native)+'</h2><textarea id="newwords" dir="auto" placeholder="'+esc(t(S.lang==="zh"?"add_hint_zh":"add_hint_en"))+'"></textarea>'+
   '<div class="actions"><button class="btn primary" id="addbtn">'+esc(t("add_btn"))+'</button></div><p class="note" id="addmsg"></p></div>'+
  '<div class="panel"><h2>'+esc(t("reset_title"))+'</h2><button class="btn danger" id="reset">'+esc(t("reset_btn"))+'</button></div>'+
  '<div class="panel"><h2>'+esc(t("notes_title"))+'</h2><p class="note" style="margin-top:0">'+esc(t("notes_voice"))+'</p><p class="note">'+esc(t("notes_storage"))+'</p><p class="note" dir="ltr" style="font-size:.78rem">'+esc(t("credits"))+'</p></div>';
  $("dclose").onclick=closeDrawer;
  $("dname").oninput=function(e){ S.name=e.target.value; save(); };
  $("dgoal").onchange=function(e){ var v=parseInt(e.target.value,10); S.goal=isFinite(v)?Math.min(500,Math.max(5,v)):20; save(); };
  bindSeg("sg-theme",function(v){ S.theme=v; save(); applyUi(); renderDrawer(); });
  bindSeg("sg-ui",function(v){ S.ui=v; save(); applyUi(); renderDrawer(); renderShell(); });
  bindSeg("sg-mean",function(v){ S.meaning=v; save(); renderDrawer(); });
  bindSeg("sg-voice",function(v){ S.voice=v; save(); renderDrawer(); });
  var msg=function(m){ $("bmsg").textContent=m; };
  var code=function(){ return JSON.stringify(S); };
  $("bcopy").onclick=function(){
    var c=code(); $("bcode").value=c;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(c).then(function(){ msg(t("copied")); },function(){ $("bcode").select(); msg(t("copy_fail")); }); }
    else { $("bcode").select(); msg(t("copy_fail")); }
  };
  $("bexp").onclick=function(){
    var c=code(); $("bcode").value=c;
    try{
      var blob=new Blob([c],{type:"application/json"}), a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="daily-lingo-progress.json"; document.body.appendChild(a); a.click(); a.remove();
      msg(t("copied"));
    }catch(e){ msg(t("copy_fail")); }
  };
  function doImport(text){
    try{
      var o=JSON.parse(text); if(!o||typeof o!=="object"||!o.langs) throw new Error("bad");
      var n=defaults(); assign(n,o); S=n; save(); applyUi(); renderDrawer(); renderShell(); $("bmsg").textContent=t("import_ok");
    }catch(e){ msg(t("import_fail")); }
  }
  $("bimp").onclick=function(){ doImport($("bcode").value); };
  $("bfile").onclick=function(){ $("ffile").click(); };
  $("ffile").onchange=function(e){ var f=e.target.files&&e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ doImport(String(r.result)); }; r.readAsText(f); };
  $("addbtn").onclick=function(){
    var lines=$("newwords").value.split("\n").map(function(l){return l.trim();}).filter(Boolean), added=0, cs=LS().custom, have={};
    allCards(S.lang).forEach(function(c){ have[c.f.toLowerCase()]=1; });
    lines.forEach(function(l){
      var p=l.split("|").map(function(s){return s.trim();});
      if(S.lang==="zh"){ if(p[0]&&p[1]&&p[2]&&!have[p[0].toLowerCase()]){ cs.push({h:p[0],p:p[1],m:p[2]}); have[p[0].toLowerCase()]=1; added++; } }
      else { if(p[0]&&p[1]&&!have[p[0].toLowerCase()]){ cs.push({w:p[0],m:p[1],e:p[2]||""}); have[p[0].toLowerCase()]=1; added++; } }
    });
    save(); $("addmsg").textContent=added?t("added_n",{n:added}):t("nothing_added"); if(added) $("newwords").value="";
  };
  $("reset").onclick=function(){ if(confirm(t("reset_confirm"))){ S.langs[S.lang]={progress:{},custom:[],level:LANGS[S.lang].levels[0]}; S.quiz[S.lang]={r:0,t:0}; save(); closeDrawer(); } };
}

/* ---------- start ---------- */
qLevel=LS().level; qMode=curLang().modes[0][0];
renderShell(); render();
})();
</script>
